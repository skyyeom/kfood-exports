name: Ingest (reusable)
on:
  workflow_call:
    inputs:
      sources:
        description: "Space-separated sources to run"
        type: string
        required: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[postgres]"
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          KCS_API_KEY: ${{ secrets.KCS_API_KEY }}
          SOURCES: ${{ inputs.sources }}
        run: python -m pipeline.run $(for s in $SOURCES; do printf -- '--source %s ' "$s"; done)
