name: Ingest (monthly)
# 04:00 KST on the 6th. Also runnable from the Actions tab or the dashboard's "Run now" (workflow_dispatch).
on:
  schedule:
    - cron: "0 19 5 * *"
  workflow_dispatch:
    inputs:
      source:
        description: "One source to run (blank = all monthly sources: pinksheet)"
        required: false
        default: ""

concurrency:
  group: ingest-monthly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e ".[postgres]"
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          KCS_API_KEY: ${{ secrets.KCS_API_KEY }}
          SOURCE: ${{ inputs.source }}
        run: |
          if [ -n "$SOURCE" ]; then python -m pipeline.run --source "$SOURCE"; else python -m pipeline.run --source pinksheet ; fi
