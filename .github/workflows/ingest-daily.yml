name: Ingest (daily)
# 02:00 KST every day. Also runnable from the Actions tab or the dashboard's "Run now" (workflow_dispatch).
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "One source to run (blank = all daily sources: fx)"
        required: false
        default: ""

concurrency:
  group: ingest-daily
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # keepalive: re-enable schedules GitHub disables after 60 days without repo activity

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e ".[postgres]"
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          KCS_API_KEY: ${{ secrets.KCS_API_KEY }}
          SOURCE: ${{ inputs.source }}
        run: |
          if [ -n "$SOURCE" ]; then python -m pipeline.run --source "$SOURCE"; else python -m pipeline.run --source fx ; fi
      - name: Keep scheduled workflows enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: for w in ingest-daily.yml ingest-weekly.yml ingest-monthly.yml; do gh workflow enable "$w" || true; done
