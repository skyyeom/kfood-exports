name: Ingest (weekly)
# 03:00 KST every Tuesday. Also runnable from the Actions tab or the dashboard's "Run now" (workflow_dispatch).
on:
  schedule:
    - cron: "0 18 * * 1"
  workflow_dispatch:
    inputs:
      source:
        description: "One source to run (blank = all weekly sources: comtrade wdi tariffs)"
        required: false
        default: ""

concurrency:
  group: ingest-weekly
  cancel-in-progress: false

jobs:
  ingest:
    uses: ./.github/workflows/_ingest.yml
    with:
      sources: ${{ inputs.source || 'comtrade wdi tariffs' }}
    secrets: inherit
