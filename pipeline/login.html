<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · WellGTM</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6d68;
    --ring: rgba(11,11,11,0.14); --field: #ffffff; --accent: #2a78d6; --focus: #2a78d6; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a988f;
      --ring: rgba(255,255,255,0.16); --field: #141413; --accent: #3987e5; --focus: #6da7ec; --critical: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a988f;
    --ring: rgba(255,255,255,0.16); --field: #141413; --accent: #3987e5; --focus: #6da7ec; --critical: #e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 380px; }
  .brand { font-weight: 700; font-size: 20px; margin-bottom: 4px; }
  .brand small { display: block; font-weight: 400; font-size: 13px; color: var(--ink-2); }
  .card { margin-top: 20px; background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .lede { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  .field { display: flex; border: 1px solid var(--ring); border-radius: 8px; background: var(--field); }
  .field:focus-within { outline: 3px solid var(--focus); outline-offset: 1px; }
  input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; padding: 10px 12px; border-radius: 8px; }
  input:focus { outline: none; }
  .toggle { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; padding: 0 12px; cursor: pointer; border-radius: 8px; }
  .toggle:focus-visible, .submit:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .submit { margin-top: 20px; width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
  .submit:disabled { opacity: .7; cursor: default; }
  .error { display: flex; gap: 8px; align-items: flex-start; margin-top: 14px; font-size: 14px; }
  .error i { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--critical); color: #fff; font-style: normal; font-size: 11px; display: grid; place-items: center; margin-top: 1px; }
  .hint { margin: 16px 0 0; font-size: 13px; color: var(--muted); }
  code { font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">WellGTM<small>K-food export intelligence</small></div>
  <div class="card">
    <h1>Sign in</h1>
    <p class="lede">Sign in to see the export market dashboard.</p>
    <form id="form" novalidate>
      <label for="username">Username</label>
      <div class="field"><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div>
      <label for="password">Password</label>
      <div class="field">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="toggle" id="toggle" aria-controls="password" aria-pressed="false">Show</button>
      </div>
      <div class="error" id="error" role="alert" hidden><i aria-hidden="true">!</i><span id="error-text"></span></div>
      <button class="submit" id="submit" type="submit">Sign in</button>
    </form>
    <p class="hint">Forgotten the password? Whoever runs the dashboard can set a new one with <code>python -m pipeline.auth set</code>.</p>
  </div>
</main>
<script>
const form = document.getElementById("form"), submit = document.getElementById("submit");
const error = document.getElementById("error"), errorText = document.getElementById("error-text");
const pw = document.getElementById("password"), toggle = document.getElementById("toggle");

toggle.addEventListener("click", () => {
  const show = pw.type === "password";
  pw.type = show ? "text" : "password";
  toggle.textContent = show ? "Hide" : "Show";
  toggle.setAttribute("aria-pressed", String(show));
  toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
});

function fail(message, field) {
  errorText.textContent = message;
  error.hidden = false;
  (field || pw).focus();
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  error.hidden = true;
  const username = form.username.value.trim(), password = pw.value;
  if (!username) return fail("Enter your username.", form.username);
  if (!password) return fail("Enter your password.");
  submit.disabled = true; submit.textContent = "Signing in…";
  try {
    const res = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({ username, password }) });
    if (res.ok) { location.replace("/" + (location.hash || "")); return; }
    const body = await res.json().catch(() => ({}));
    fail(body.error || "Could not sign in. Try again.");
    if (res.status === 401) { pw.select(); }
  } catch {
    fail("Can't reach the dashboard server. Check that it is running.");
  } finally {
    submit.disabled = false; submit.textContent = "Sign in";
  }
});
</script>
</body>
</html>
