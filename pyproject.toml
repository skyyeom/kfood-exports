[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wellgtm-pipeline"
version = "0.1.0"
description = "WellGTM automated data ingestion"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["pipeline", "pipeline.sources"]

[tool.setuptools.package-data]
pipeline = ["tariff_overrides.yaml", "preview.html", "login.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["analysis"]
